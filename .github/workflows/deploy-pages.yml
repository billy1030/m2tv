name: Deploy MoonTV to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # packageManager in package.json will automatically specify exact version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with next-on-pages
        run: pnpm pages:build
        env:
          PASSWORD: ${{ secrets.PASSWORD }}

      - name: Sync PASSWORD secret to Cloudflare Pages
        if: ${{ secrets.PASSWORD != '' }}
        run: echo "${{ secrets.PASSWORD }}" | npx wrangler pages secret put PASSWORD --project-name=moontv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .vercel/output/static --project-name=moontv --commit-dirty=true
